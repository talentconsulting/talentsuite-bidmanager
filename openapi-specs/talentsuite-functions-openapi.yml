openapi: 3.1.0
info:
  title: TalentSuite Functions
  version: 1.0.0
servers:
  - url: /
paths:
  /health:
    get:
      operationId: HealthCheck
      summary: Health check
      description: Checks health of infrastructure storage, bid storage, and Google Drive sync.
      responses:
        '200':
          description: Function app is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  infraStorage:
                    type: string
                  bidStorage:
                    type: string
                  googleDrive:
                    type: string
        '503':
          description: Function app is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  infraStorage:
                    type: string
                  bidStorage:
                    type: string
                  googleDrive:
                    type: string
                  failedDependency:
                    type: string
                  error:
                    type: string
      tags:
        - Health
components: {}
