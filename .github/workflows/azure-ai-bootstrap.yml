name: Azure AI Bootstrap

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment to use for this deployment
        required: true
        default: dev
        type: environment

permissions:
  contents: read

jobs:
  bootstrap-azure-ai:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      AZURE_ENV_NAME: ${{ inputs.target_environment }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required inputs
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "AZURE_CLIENT_ID missing" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "AZURE_TENANT_ID missing" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "AZURE_SUBSCRIPTION_ID missing" && exit 1)
          test -n "${AZURE_ENV_NAME:-}" || (echo "AZURE_ENV_NAME missing" && exit 1)
          test -n "${AZURE_LOCATION:-}" || (echo "AZURE_LOCATION missing" && exit 1)

      - name: Resolve environment defaults
        run: |
          set -euo pipefail

          env_suffix="${AZURE_ENV_NAME}"
          resource_group="rg-${env_suffix}"
          document_intelligence_account="docintelligence-talentsuite-${env_suffix}"
          document_intelligence_custom_domain="docintelligence-talentsuite-${env_suffix}"
          foundry_account="foundry-talentsuite-${env_suffix}"
          foundry_project="foundry-prj-talentsuite-${env_suffix}"
          foundry_model_deployment="gpt-4o"
          foundry_model_name="gpt-4o"
          foundry_model_version="2024-11-20"
          agent_name="foundry-agent-talentsuite-${env_suffix}"
          openai_account="openai-talentsuite-${env_suffix}"
          openai_model_deployment="gpt-4-1"
          openai_model_name="gpt-4.1"
          openai_model_version="2025-04-14"
          search_service="aisearch-talentsuite-${env_suffix}"
          search_index_name="index-talentsuite-${env_suffix}"
          storage_container="bidlibrary"
          storage_account="$(az resource list \
            --resource-group "$resource_group" \
            --resource-type "Microsoft.Storage/storageAccounts" \
            --query "[?tags.\"aspire-resource-name\"=='bidcontentstorage'][0].name" \
            -o tsv 2>/dev/null || true)"

          if [ -z "$storage_account" ]; then
            storage_account="$(az storage account list \
              --resource-group "$resource_group" \
              --query "[?starts_with(name, 'bidcontentstorage')][0].name" \
              -o tsv 2>/dev/null || true)"
          fi

          if [ -z "$storage_account" ]; then
            storage_account="$(az resource list \
              --resource-group "$resource_group" \
              --resource-type "Microsoft.Storage/storageAccounts/blobServices/containers" \
              --query "[?name=='default/bidstorage'].split(id, '/')[8] | [0]" \
              -o tsv 2>/dev/null || true)"
          fi

          test -n "$storage_account" || (echo "Could not resolve bid content storage account in $resource_group" && exit 1)

          case "$env_suffix" in
            production)
              document_intelligence_sku="F0"
              ;;
            *)
              document_intelligence_sku="S0"
              ;;
          esac

          {
            echo "BOOTSTRAP_RESOURCE_GROUP=$resource_group"
            echo "BOOTSTRAP_DOCUMENT_INTELLIGENCE_ACCOUNT=$document_intelligence_account"
            echo "BOOTSTRAP_DOCUMENT_INTELLIGENCE_CUSTOM_DOMAIN=$document_intelligence_custom_domain"
            echo "BOOTSTRAP_DOCUMENT_INTELLIGENCE_SKU=$document_intelligence_sku"
            echo "BOOTSTRAP_FOUNDRY_ACCOUNT=$foundry_account"
            echo "BOOTSTRAP_FOUNDRY_PROJECT=$foundry_project"
            echo "BOOTSTRAP_FOUNDRY_MODEL_DEPLOYMENT=$foundry_model_deployment"
            echo "BOOTSTRAP_FOUNDRY_MODEL_NAME=$foundry_model_name"
            echo "BOOTSTRAP_FOUNDRY_MODEL_VERSION=$foundry_model_version"
            echo "BOOTSTRAP_AGENT_NAME=$agent_name"
            echo "BOOTSTRAP_OPENAI_ACCOUNT=$openai_account"
            echo "BOOTSTRAP_OPENAI_MODEL_DEPLOYMENT=$openai_model_deployment"
            echo "BOOTSTRAP_OPENAI_MODEL_NAME=$openai_model_name"
            echo "BOOTSTRAP_OPENAI_MODEL_VERSION=$openai_model_version"
            echo "BOOTSTRAP_SEARCH_SERVICE=$search_service"
            echo "BOOTSTRAP_SEARCH_INDEX_NAME=$search_index_name"
            echo "BOOTSTRAP_STORAGE_ACCOUNT=$storage_account"
            echo "BOOTSTRAP_STORAGE_CONTAINER=$storage_container"
          } >> "$GITHUB_ENV"

      - name: Bootstrap Azure AI resources
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/provision-foundry-agent-stack.sh

          args=(
            --subscription "${AZURE_SUBSCRIPTION_ID}"
            --resource-group "${BOOTSTRAP_RESOURCE_GROUP}"
            --location "${AZURE_LOCATION}"
            --agent-name "${BOOTSTRAP_AGENT_NAME}"
            --foundry-model-deployment "${BOOTSTRAP_FOUNDRY_MODEL_DEPLOYMENT}"
            --foundry-model-name "${BOOTSTRAP_FOUNDRY_MODEL_NAME}"
            --foundry-model-version "${BOOTSTRAP_FOUNDRY_MODEL_VERSION}"
            --openai-model-deployment "${BOOTSTRAP_OPENAI_MODEL_DEPLOYMENT}"
            --openai-model-name "${BOOTSTRAP_OPENAI_MODEL_NAME}"
            --openai-model-version "${BOOTSTRAP_OPENAI_MODEL_VERSION}"
            --document-intelligence-account "${BOOTSTRAP_DOCUMENT_INTELLIGENCE_ACCOUNT}"
            --document-intelligence-custom-domain "${BOOTSTRAP_DOCUMENT_INTELLIGENCE_CUSTOM_DOMAIN}"
            --document-intelligence-sku "${BOOTSTRAP_DOCUMENT_INTELLIGENCE_SKU}"
            --foundry-account "${BOOTSTRAP_FOUNDRY_ACCOUNT}"
            --foundry-project "${BOOTSTRAP_FOUNDRY_PROJECT}"
            --openai-account "${BOOTSTRAP_OPENAI_ACCOUNT}"
            --search-service "${BOOTSTRAP_SEARCH_SERVICE}"
            --search-index-name "${BOOTSTRAP_SEARCH_INDEX_NAME}"
            --storage-account "${BOOTSTRAP_STORAGE_ACCOUNT}"
            --storage-container "${BOOTSTRAP_STORAGE_CONTAINER}"
            --auto-index-blob-storage
            --emit-azd-env
          )

          output_file="$(mktemp)"
          scripts/ci/provision-foundry-agent-stack.sh "${args[@]}" | tee "$output_file"

          {
            echo "## Azure AI Bootstrap"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
