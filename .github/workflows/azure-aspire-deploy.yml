name: Azure Aspire Deploy
run-name: Backend CI - ${{ github.event_name }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy to.'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deployment_mode:
        description: 'Choose whether to provision infrastructure first or only deploy application code.'
        required: true
        default: 'infra-and-apps'
        type: choice
        options:
          - infra-and-apps
          - apps-only
      deploy_target:
        description: 'Choose which application component to deploy.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - keycloak
          - talentserver
          - talentfunctions
          - grafana
          - frontend

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      # ---- azd / Azure context ----
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

      #AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      Azure__ResourceGroup: 'rg-talentsuite-${{ inputs.environment }}'

      AZD_WORKING_DIR: '.'
      DOTNET_LAUNCH_PROFILE: 'https-azure'
      TALENTSUITE_FORCE_AZURE_INFRA: 'true'

      # ---- AppHost mode switch ----
      TALENTSUITE_INFRA_MODE: 'azure'

      # --- Aspire CLI configuration ----
      Parameters__KeycloakClientId: ${{ vars.KEYCLOAK_CLIENT_ID }}
      Parameters__KeycloakAdminUsername: ${{ vars.KEYCLOAK_ADMIN_USERNAME }}
      Parameters__KeycloakPassword: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      Parameters__SqlPassword: ${{ secrets.SQL_PASSWORD }}
      Parameters__KeycloakDbUsername: ${{ vars.KEYCLOAK_DB_USERNAME }}
      Parameters__KeycloakDbPassword: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
      Parameters__AuthenticationEnabled: ${{ vars.AUTHENTICATION_ENABLED }}
      Parameters__UseInMemoryData: ${{ vars.USE_IN_MEMORY_DATA }}
      Parameters__InviteEmailEnabled: ${{ vars.INVITE_EMAIL_ENABLED }}
      Parameters__InviteFromEmail: ${{ vars.INVITE_FROM_EMAIL }}
      Parameters__InviteSmtpHost: ${{ vars.INVITE_SMTP_HOST }}
      Parameters__InviteSmtpPort: ${{ vars.INVITE_SMTP_PORT }}
      Parameters__InviteSmtpEnableSsl: ${{ vars.INVITE_SMTP_ENABLE_SSL }}
      Parameters__InviteSmtpUsername: ${{ vars.INVITE_SMTP_USERNAME }}
      Parameters__InviteSmtpPassword: ${{ secrets.INVITE_SMTP_PASSWORD }}
      Parameters__GoogleDriveSyncEnabled: ${{ vars.GOOGLE_DRIVE_SYNC_ENABLED }}
      Parameters__GoogleDriveSyncSourceContainerName: ${{ vars.GOOGLE_DRIVE_SYNC_SOURCE_CONTAINER_NAME }}
      Parameters__GoogleDriveSyncDriveFolderId: ${{ vars.GOOGLE_DRIVE_SYNC_DRIVE_FOLDER_ID }}
      Parameters__GoogleDriveSyncServiceAccountJsonBase64: ${{ secrets.GOOGLE_DRIVE_SYNC_SERVICE_ACCOUNT_JSON_BASE64 }}
      Parameters__DocumentIntelligenceEndpoint: ${{ vars.DOCUMENT_INTELLIGENCE_ENDPOINT }}
      Parameters__DocumentIntelligenceApiKey: ${{ secrets.DOCUMENT_INTELLIGENCE_API_KEY }}
      Parameters__AzureOpenAIEndpoint: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      Parameters__AzureOpenAIApiKey: ${{ secrets.AZURE_OPENAI_API_KEY }}
      Parameters__AzureOpenAIChatDeployment: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      Parameters__AzureAIFoundryProjectEndpoint: ${{ vars.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      Parameters__AgentsAgentId: ${{ vars.AGENTS_AGENT_ID }}
      Parameters__FrontendPublicOrigin: ${{ vars.FRONTEND_PUBLIC_ORIGIN }}
      Parameters__ApiPublicOrigin: ${{ vars.API_PUBLIC_ORIGIN }}
      Parameters__KeycloakPublicOrigin: ${{ vars.KEYCLOAK_PUBLIC_ORIGIN }}
      Parameters__GrafanaEntraEnabled: ${{ vars.GRAFANA_ENTRA_ENABLED }}
      Parameters__GrafanaEntraClientId: ${{ vars.GRAFANA_ENTRA_CLIENT_ID }}
      Parameters__GrafanaEntraTenantId: ${{ vars.GRAFANA_ENTRA_TENANT_ID }}
      Parameters__GrafanaPublicOrigin: ${{ vars.GRAFANA_PUBLIC_ORIGIN }}
      Parameters__GrafanaAzureMonitorSubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---- App configuration (non-secret) ----
      # #AuthenticationEnabled: ${{ vars.AUTHENTICATION_ENABLED }}
      # ApiPublicOrigin: ${{ vars.API_PUBLIC_ORIGIN }}
      # #UseInMemoryData: ${{ vars.USE_IN_MEMORY_DATA }}
      # KeycloakClientId: ${{ vars.KEYCLOAK_CLIENT_ID }}
      # #KeycloakDbUsername: ${{ vars.KEYCLOAK_DB_USERNAME }}
      # KeyVaultName: ${{ vars.KEY_VAULT_NAME }}
      # #InviteEmailEnabled: ${{ vars.INVITE_EMAIL_ENABLED }}
      # InviteFromEmail: ${{ vars.INVITE_FROM_EMAIL }}
      # InviteSmtpHost: ${{ vars.INVITE_SMTP_HOST }}
      # InviteSmtpPort: ${{ vars.INVITE_SMTP_PORT }}
      # InviteSmtpEnableSsl: ${{ vars.INVITE_SMTP_ENABLE_SSL }}
      # InviteSmtpUsername: ${{ vars.INVITE_SMTP_USERNAME }}
      # GoogleDriveSyncEnabled: ${{ vars.GOOGLE_DRIVE_SYNC_ENABLED }}
      # GoogleDriveSyncSourceContainerName: ${{ vars.GOOGLE_DRIVE_SYNC_SOURCE_CONTAINER_NAME }}
      # GoogleDriveSyncDriveFolderId: ${{ vars.GOOGLE_DRIVE_SYNC_DRIVE_FOLDER_ID }}
      # DocumentIntelligenceEndpoint: ${{ vars.DOCUMENT_INTELLIGENCE_ENDPOINT }}
      # AzureOpenAIEndpoint: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      # AzureOpenAIChatDeployment: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      # AzureAIFoundryProjectEndpoint: ${{ vars.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      # AgentsAgentId: ${{ vars.AGENTS_AGENT_ID }}
      # FrontendPublicOrigin: ${{ vars.FRONTEND_PUBLIC_ORIGIN }}
      # KeycloakPublicOrigin: ${{ vars.KEYCLOAK_PUBLIC_ORIGIN }}
      # GrafanaEntraEnabled: ${{ vars.GRAFANA_ENTRA_ENABLED }}
      # GrafanaEntraClientId: ${{ vars.GRAFANA_ENTRA_CLIENT_ID }}
      # GrafanaEntraTenantId: ${{ vars.GRAFANA_ENTRA_TENANT_ID }}
      # GrafanaPublicOrigin: ${{ vars.GRAFANA_PUBLIC_ORIGIN }}
      # GrafanaAzureMonitorSubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---- App configuration (secret) ----
      # SqlPassword: ${{ secrets.SQL_PASSWORD }}
      # KeycloakPassword: ${{ secrets.KEYCLOAK_PASSWORD }}
      # KeycloakDbPassword: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
      # InviteSmtpPassword: ${{ secrets.INVITE_SMTP_PASSWORD }}
      # GoogleDriveSyncServiceAccountJsonBase64: ${{ secrets.GOOGLE_DRIVE_SYNC_SERVICE_ACCOUNT_JSON_BASE64 }}
      # DocumentIntelligenceApiKey: ${{ secrets.DOCUMENT_INTELLIGENCE_API_KEY }}
      # AzureOpenAIApiKey: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # GrafanaEntraClientSecret: ${{ secrets.GRAFANA_ENTRA_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup azd
        uses: Azure/setup-azd@v2
        with:
          version: 1.24.2

      - name: Enable azd operations alpha feature
        run: |
          azd config set alpha.azd.operations on

      - name: Install Aspire CLI
        uses: timheuer/setup-aspire@v0.1.0

      - name: Validate Azure login inputs
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "AZURE_CLIENT_ID missing" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "AZURE_TENANT_ID missing" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "AZURE_SUBSCRIPTION_ID missing" && exit 1)
          test -n "${Parameters__AuthenticationEnabled:-}" || (echo "AUTHENTICATION_ENABLED var missing" && exit 1)
          test -n "${Parameters__UseInMemoryData:-}" || (echo "USE_IN_MEMORY_DATA var missing" && exit 1)
          test -n "${Parameters__KeycloakClientId:-}" || (echo "KEYCLOAK_CLIENT_ID var missing" && exit 1)
          test -n "${Parameters__KeycloakDbUsername:-}" || (echo "KEYCLOAK_DB_USERNAME var missing" && exit 1)
          test -n "${Parameters__InviteSmtpUsername:-}" || (echo "INVITE_SMTP_USERNAME var missing" && exit 1)
          test -n "${Parameters__SqlPassword:-}" || (echo "SQL_PASSWORD secret missing" && exit 1)
          test -n "${Parameters__KeycloakPassword:-}" || (echo "KEYCLOAK_PASSWORD secret missing" && exit 1)
          test -n "${Parameters__KeycloakDbPassword:-}" || (echo "KEYCLOAK_DB_PASSWORD secret missing" && exit 1)
          test -n "${Parameters__InviteSmtpPassword:-}" || (echo "INVITE_SMTP_PASSWORD secret missing" && exit 1)

      - name: Aspire Do
        run: |
          aspire do diagnostics --environment ${{ inputs.environment }}

      - name: Aspire Do build
        run: |
          aspire do build --environment ${{ inputs.environment }}
